
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | BlogSpace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a class="logo" href="index.html">BlogSpace</a>
    <nav><a href="index.html">Home</a><a href="register.html">Register</a></nav>
  </header>

  <main class="panel auth-card">
    <h1>Welcome back!</h1>
    <p>Log in to write and comment on blogs.</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Email address" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p id="authMessage" class="message" role="status"></p>
    <p>Don't have an account? <a href="register.html">Register here</a></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
